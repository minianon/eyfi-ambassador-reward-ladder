<meta charset="utf-8" />
<title>EYFI Ambassador — Reward Ladder</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Open+Sans:wght@600;700&display=swap" rel="stylesheet" />

<style>
  :root{
    --bg: oklch(17% .005 250);
    --card: oklch(18% 0 0);
    --surface: oklch(22% .005 250);
    --fg: oklch(98% 0 0);
    --muted-fg: oklch(80% 0 0);
    --para: #C8C8C4;
    --faint: #8A8A85;
    --lime: oklch(90% .22 125);         /* #C4F62E */
    --lime-fg: oklch(14% 0 0);
    --lime-deep: #5E7D14;               /* pressable shadow */
    --orange: #FF5A1F;
    --gold: #E8B923;
    --border: rgba(255,255,255,.12);

    --lime-sphere: radial-gradient(circle at 70% 25%, #F4FFB8 0%, #DFF864 30%, #A9D91A 65%, #6E8E10 100%);
    --gold-sphere: radial-gradient(circle at 32% 28%, #FFF6D0 0%, #FFDE6E 30%, #F0AC1F 65%, #C9820D 100%);
    --card-grad: linear-gradient(155deg, #2A2A2A, #141414);

    --sans: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    --display: "Bricolage Grotesque", "Space Grotesk", sans-serif;
    --serif: "Instrument Serif", ui-serif, Georgia, serif;
    --label: "Open Sans", ui-sans-serif, system-ui, sans-serif;
    --ease: cubic-bezier(.4,0,.2,1);
    --spring: cubic-bezier(.22,1.2,.36,1);
  }

  *{ box-sizing:border-box; }
  html,body{ overflow-x:clip; }
  body{
    margin:0;
    background-color: var(--bg);
    background-image: radial-gradient(circle, rgba(255,255,255,.10) 1.2px, transparent 1.4px);
    background-size: 22px 22px;
    color: var(--fg);
    font-family: var(--sans);
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  a{ color:inherit; text-decoration:none; }

  /* ---------- marquee ---------- */
  .marquee{
    background: var(--orange);
    color:#0A0A0A; overflow:hidden; white-space:nowrap;
    border-bottom: 2px solid #0A0A0A;
  }
  .marquee .row{ display:inline-flex; gap:0; will-change:transform; animation: eyfi-marquee 26s linear infinite; }
  .marquee span{ font-family:var(--display); font-weight:800; font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; padding:9px 0; }
  .marquee .sep{ padding:9px 20px; opacity:.9; }
  @keyframes eyfi-marquee{ to{ transform: translateX(-50%); } }

  /* ---------- nav ---------- */
  .nav{ max-width:960px; margin:0 auto; padding:16px 20px; display:flex; align-items:center; gap:14px; }
  .nav img{ height:30px; width:auto; display:block; }
  .nav .tag{
    font-family:var(--label); font-weight:700; font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--faint); border-left:1px solid var(--border); padding-left:14px;
  }
  .nav .spacer{ flex:1; }
  .btn{
    font-family:var(--sans); font-weight:700; cursor:pointer; border:none; display:inline-flex; align-items:center; gap:8px;
    background:var(--lime); color:var(--lime-fg); border-radius:999px; padding:11px 22px; font-size:14px;
    box-shadow: var(--lime-deep) 0 5px 0 0, rgba(0,0,0,.55) 0 10px 20px -8px;
    transition: transform .12s var(--ease), box-shadow .12s var(--ease), filter .12s var(--ease);
  }
  .btn:hover{ filter:brightness(1.04); }
  .btn:active,.btn.pressed{ transform:translateY(4px); box-shadow: var(--lime-deep) 0 1px 0 0, rgba(0,0,0,.5) 0 4px 10px -6px; }
  .btn:focus-visible{ outline:3px solid #fff; outline-offset:3px; }
  .nav .btn{ padding:9px 18px; font-size:13px; }

  /* ---------- section ---------- */
  .wrap{ position:relative; max-width:760px; margin:0 auto; padding:34px 20px 30px; }
  .section-head{ text-align:center; position:relative; z-index:2; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px; font-family:var(--label); font-weight:700;
    font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--lime);
    border:1px solid rgba(196,246,46,.35); background:rgba(196,246,46,.06);
    padding:6px 14px; border-radius:999px;
  }
  h1.headline{
    font-family:var(--display); font-weight:800; letter-spacing:-.03em; line-height:1;
    font-size: clamp(38px, 9vw, 62px); margin:18px 0 0; text-wrap:balance;
  }
  h1.headline .lime{ color:var(--lime); }
  .subhead{
    font-family:var(--serif); font-style:italic; color:var(--gold);
    font-size: clamp(19px, 4.4vw, 26px); margin:12px 0 0; line-height:1.25;
  }
  .subhead .plain{ font-family:var(--sans); font-style:normal; color:var(--para); font-size:15px; display:block; margin-top:8px; }

  /* ---------- floating decor coins ---------- */
  .decor{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .fc{ position:absolute; animation: eyfi-float 6s ease-in-out infinite; }
  .fc > i{ display:block; animation: eyfi-sphere-spin 9s linear infinite; transform-style:preserve-3d; }
  @keyframes eyfi-float{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-10px) } }
  @keyframes eyfi-sphere-spin{ to{ transform: rotateY(360deg) } }

  .coin{
    border-radius:50%; background:var(--lime-sphere); color:#2c3a06;
    display:grid; place-items:center; font-family:var(--display); font-weight:800;
    box-shadow: inset 0 -4px 8px rgba(0,0,0,.4), inset 0 3px 6px rgba(255,255,255,.55), 0 5px 12px rgba(0,0,0,.45);
  }
  .coin.gold{ background:var(--gold-sphere); color:#5a3d06; }
  .coin.dim{ background: radial-gradient(circle at 60% 30%, #4a4a44, #2a2a26); color:#7d7d76; box-shadow: inset 0 -3px 7px rgba(0,0,0,.5), inset 0 2px 5px rgba(255,255,255,.08); }

  /* ---------- ladder card ---------- */
  .card{
    position:relative; z-index:2; margin-top:26px;
    background: var(--card-grad); border:1px solid var(--border); border-radius:20px;
    padding:22px 22px 26px; box-shadow: 0 30px 70px -30px rgba(0,0,0,.9);
  }
  .card-glow{ position:absolute; inset:0; border-radius:20px; pointer-events:none; box-shadow: inset 0 0 0 1px rgba(196,246,46,.10); }

  .ladder-top{ display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; }
  .rc-label{ font-family:var(--label); font-weight:700; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); }
  .count{
    font-family:var(--display); font-weight:800; letter-spacing:-.03em; line-height:.85;
    font-size: clamp(50px, 15vw, 84px); color:var(--lime);
    font-variant-numeric: tabular-nums;
  }
  .rank{ margin-left:auto; display:flex; align-items:center; gap:11px; background:rgba(255,255,255,.03); border:1px solid var(--border); border-radius:14px; padding:8px 14px 8px 8px; }
  .rank .coin{ width:38px; height:38px; font-size:17px; }
  .rank .rk-l{ font-family:var(--label); font-weight:700; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); }
  .rank .rk-n{ font-family:var(--display); font-weight:800; font-size:15px; letter-spacing:-.01em; line-height:1.05; margin-top:2px; }

  /* slider */
  .slider-wrap{ margin-top:20px; }
  .track{ position:relative; height:30px; }
  .track .rail{ position:absolute; top:11px; left:0; right:0; height:8px; border-radius:999px; background:rgba(255,255,255,.09); border:1px solid var(--border); }
  .track .fill{ position:absolute; top:11px; left:0; height:8px; border-radius:999px; width:0;
    background: linear-gradient(90deg, #6E8E10, var(--lime)); box-shadow:0 0 14px rgba(196,246,46,.5);
    transition: width .45s var(--spring); }
  input[type=range]{ -webkit-appearance:none; appearance:none; position:absolute; top:0; left:0; width:100%; height:30px; margin:0; background:transparent; cursor:grab; }
  input[type=range]:active{ cursor:grabbing; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; width:30px; height:30px; border-radius:50%;
    background:var(--lime-sphere); border:2px solid #eaffb0;
    box-shadow: inset 0 -3px 6px rgba(0,0,0,.4), inset 0 2px 5px rgba(255,255,255,.6), 0 4px 12px rgba(0,0,0,.55); }
  input[type=range]::-moz-range-thumb{ width:28px; height:28px; border:2px solid #eaffb0; border-radius:50%; background:#C4F62E;
    box-shadow: 0 4px 12px rgba(0,0,0,.55); }
  input[type=range]:focus-visible::-webkit-slider-thumb{ outline:3px solid #fff; outline-offset:2px; }
  .ticks{ position:relative; height:26px; margin-top:4px; }
  .tick{ position:absolute; transform:translateX(-50%); text-align:center; }
  .tick b{ display:block; width:2px; height:6px; background:var(--border); margin:0 auto 3px; border-radius:2px; }
  .tick span{ font-family:var(--label); font-weight:700; font-size:10px; color:var(--faint); font-variant-numeric:tabular-nums; }
  .tick.hit span{ color:var(--lime); }
  .tick.hit b{ background:var(--lime); }

  .status{ margin-top:14px; font-family:var(--sans); font-weight:600; font-size:14.5px; color:var(--fg); min-height:22px; text-align:center; }
  .status .lime{ color:var(--lime); }
  .status .gold{ color:var(--gold); font-family:var(--serif); font-style:italic; font-size:17px; }

  /* tiers */
  .tiers{ position:relative; margin-top:22px; display:flex; flex-direction:column; gap:10px; }
  .spine{ position:absolute; left:26px; top:26px; bottom:26px; width:3px; background:rgba(255,255,255,.08); border-radius:3px; z-index:0; }
  .spine-fill{ position:absolute; left:26px; top:26px; width:3px; background:linear-gradient(180deg,#6E8E10,var(--lime)); border-radius:3px; z-index:0; height:0;
    box-shadow:0 0 10px rgba(196,246,46,.5); transition:height .5s var(--spring); }

  .tier{ position:relative; z-index:1; display:grid; grid-template-columns:54px 1fr; align-items:center;
    gap:14px; padding:13px 16px 13px 12px; border-radius:14px; border:1px solid transparent; background:rgba(255,255,255,.02);
    transition: background .35s var(--ease), border-color .35s var(--ease), opacity .35s var(--ease), transform .35s var(--spring); }
  .tier .coin{ width:44px; height:44px; font-size:17px; justify-self:center; }
  .tier .body{ min-width:0; }
  .tier .t-top{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .tier .t-name{ font-family:var(--display); font-weight:800; font-size:16px; letter-spacing:-.01em; }
  .tier .t-regs{ font-family:var(--label); font-weight:700; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); }
  .tier .t-desc{ margin-top:3px; font-size:13.5px; color:var(--para); line-height:1.4; }
  .tier .pill{ margin-left:auto; font-family:var(--label); font-weight:700; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
    padding:4px 10px; border-radius:999px; background:rgba(255,255,255,.06); color:var(--faint); border:1px solid var(--border); white-space:nowrap; }

  .tier.locked{ opacity:.5; }
  .tier.unlocked{ background:rgba(196,246,46,.05); border-color:rgba(196,246,46,.22); }
  .tier.unlocked .pill{ background:rgba(196,246,46,.14); color:var(--lime); border-color:rgba(196,246,46,.4); }
  .tier.current{ background:linear-gradient(120deg, rgba(255,90,31,.12), rgba(196,246,46,.06)); border-color:rgba(196,246,46,.55);
    box-shadow:0 0 0 1px rgba(196,246,46,.25), 0 16px 40px -20px rgba(196,246,46,.5); transform:translateX(2px); }
  .tier.current .pill{ background:var(--lime); color:var(--lime-fg); border-color:transparent; }
  .tier.current .coin{ animation: eyfi-sphere-spin 3.5s linear infinite; }
  .tier.pop{ animation: tier-pop .55s var(--spring); }
  @keyframes tier-pop{ 0%{ transform:scale(1) } 34%{ transform:scale(1.03) translateX(2px) } 100%{ transform:scale(1) translateX(2px) } }

  .controls{ margin-top:22px; display:flex; justify-content:center; }

  /* footer */
  footer{ text-align:center; padding:26px 20px 44px; color:var(--faint); font-size:13px; }
  footer .p{ color:var(--lime); font-weight:700; }

  canvas#fx{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:60; }

  @media (max-width:520px){
    .decor{ display:none; }
    .rank{ margin-left:0; }
    .nav .tag{ display:none; }
    .tier{ grid-template-columns:44px 1fr; }
    .spine,.spine-fill{ left:22px; }
    .tier .coin{ width:38px; height:38px; font-size:15px; }
    .tier .pill{ order:3; margin-left:0; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; }
    .fill,.spine-fill,.tier{ transition:none !important; }
    .marquee .row{ animation:none !important; }
  }
</style>

<script>
(() => {
  const TIERS = [
    { t:0,   name:"Scout",                        reward:"Private community access + starter kit — you're in the movement from day one." },
    { t:25,  name:"Campus Ambassador",            reward:"Official Campus Ambassador title + badge, first swag drop, and a prize-linked challenge." },
    { t:50,  name:"Level up",                      reward:"Event grants for your campus + exclusive merch." },
    { t:75,  name:"Go further",                    reward:"Mentorship access + campus event grants." },
    { t:100, name:"Paid Internship Opportunity",   reward:"Paid internship opportunities + invite to ambassador events." },
    { t:200, name:"Founding Team",                 reward:"Consideration for the EYFI Founding Team." },
  ];
  const MAX = 220;
  const $ = id => document.getElementById(id);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // marquee content (duplicated for seamless loop)
  const MQ = ["WAVE 01 SCOUTS","APPLICATIONS OPEN","BUILD EYFI ON YOUR CAMPUS","₹2L IN PRIZES","LIMITED SPOTS PER COLLEGE","EARNED, NOT HANDED"];
  const mqHtml = MQ.map(s => `<span class="sep">✦</span><span>${s}</span>`).join("");
  $("mq").innerHTML = mqHtml + mqHtml;

  // floating decor coins
  const decor = $("decor");
  const coins = [
    {x:"4%",  y:"12%", s:46, d:0,   g:false},
    {x:"90%", y:"8%",  s:60, d:1.2, g:false},
    {x:"88%", y:"64%", s:38, d:.6,  g:true},
    {x:"3%",  y:"70%", s:52, d:1.8, g:false},
    {x:"12%", y:"40%", s:30, d:.9,  g:true},
    {x:"94%", y:"38%", s:34, d:2.2, g:false},
  ];
  decor.innerHTML = coins.map(c =>
    `<div class="fc" style="left:${c.x};top:${c.y};animation-delay:${c.d}s">
       <i><span class="coin ${c.g?'gold':''}" style="width:${c.s}px;height:${c.s}px;font-size:${Math.round(c.s*0.42)}px">₹</span></i>
     </div>`).join("");

  // build tiers
  const tiersEl = $("tiers");
  const nodes = TIERS.map((tier,i) => {
    const el = document.createElement("div");
    el.className = "tier";
    const regs = tier.t === 0 ? "Selected" : (tier.t>=200 ? "200+ regs" : `${tier.t}${tier.t>=50?"+":""} regs`);
    el.innerHTML = `
      <span class="coin dim">₹</span>
      <div class="body">
        <div class="t-top">
          <span class="t-name">${tier.name}</span>
          <span class="t-regs">${regs}</span>
          <span class="pill">Locked</span>
        </div>
        <div class="t-desc">${tier.reward}</div>
      </div>`;
    tiersEl.appendChild(el);
    return { el, coin: el.querySelector(".coin"), pill: el.querySelector(".pill"), tier };
  });

  // ticks
  const ticksEl = $("ticks");
  [0,25,50,75,100,200].forEach(v => {
    const d = document.createElement("div");
    d.className = "tick"; d.dataset.v = v;
    d.style.left = (v/MAX*100) + "%";
    d.innerHTML = `<b></b><span>${v===200?"200+":v}</span>`;
    ticksEl.appendChild(d);
  });
  const tickEls = [...ticksEl.children];

  const slider=$("slider"), fill=$("fill"), spineFill=$("spineFill"),
        countEl=$("count"), rankName=$("rankName"), rankCoin=$("rankCoin"), statusEl=$("status");

  let unlocked = new Set([0]);
  let first = true;

  const idxFor = v => { let i=0; for(let k=0;k<TIERS.length;k++) if(v>=TIERS[k].t) i=k; return i; };

  const render = v => {
    v = Math.max(0, Math.min(MAX, v));
    const idx = idxFor(v), cur = TIERS[idx], next = TIERS[idx+1];
    countEl.textContent = v>=200 ? "200+" : String(v);
    fill.style.width = (v/MAX*100) + "%";
    rankName.textContent = cur.name;

    // status
    if (v === 0) statusEl.innerHTML = `You're a <span class="lime">Scout</span> — register your first person to start climbing.`;
    else if (next) statusEl.innerHTML = `<span class="lime">${next.t - v}</span> more to unlock <span class="lime">${next.name}</span> →`;
    else statusEl.innerHTML = `<span class="gold">Founding Team.</span> You've maxed the ladder. 🏆`;

    // ticks reached
    tickEls.forEach(t => t.classList.toggle("hit", v >= +t.dataset.v));

    // spine fill up to current coin
    if (nodes.length){
      const base = tiersEl.getBoundingClientRect();
      const cc = nodes[idx].coin.getBoundingClientRect();
      let y = cc.top - base.top + cc.height/2 - 26;
      if (next){
        const nc = nodes[idx+1].coin.getBoundingClientRect();
        const ny = nc.top - base.top + nc.height/2 - 26;
        const frac = Math.min(1,(v-cur.t)/((next.t-cur.t)||1));
        y = (cc.top - base.top + cc.height/2 - 26) + (ny - (cc.top - base.top + cc.height/2 - 26))*frac;
      }
      spineFill.style.height = Math.max(0,y) + "px";
    }

    nodes.forEach((n,i) => {
      const reached = v >= TIERS[i].t, isCur = i === idx;
      n.el.classList.toggle("locked", !reached);
      n.el.classList.toggle("current", reached && isCur);
      n.el.classList.toggle("unlocked", reached && !isCur);
      n.coin.classList.toggle("dim", !reached);
      n.coin.classList.toggle("gold", reached);
      if (reached){
        n.pill.textContent = isCur ? "You're here" : "Unlocked";
        if(!unlocked.has(i)){ unlocked.add(i); if(!first) celebrate(n); }
      } else { n.pill.textContent = "Locked"; unlocked.delete(i); }
    });

    // header rank coin state
    rankCoin.className = "coin " + (v>0 ? "gold":"gold");
    first = false;
  };

  const celebrate = n => {
    n.el.classList.add("pop");
    setTimeout(()=>n.el.classList.remove("pop"), 600);
    if(!reduce){ const r=n.coin.getBoundingClientRect(); burst(r.left+r.width/2, r.top+r.height/2); }
  };

  slider.addEventListener("input", () => { stopAuto(); render(+slider.value); });
  addEventListener("resize", () => render(+slider.value));

  // auto-climb
  let raf=null; const play=$("play");
  const stopAuto = () => { if(raf){ cancelAnimationFrame(raf); raf=null; play.innerHTML='▶ &nbsp;Auto-climb'; play.classList.remove("pressed"); } };
  play.addEventListener("click", () => {
    if(raf){ stopAuto(); return; }
    unlocked=new Set(); first=true; slider.value=0; render(0); first=false; unlocked=new Set([0]);
    play.innerHTML='⏸ &nbsp;Climbing…'; play.classList.add("pressed");
    let v=0;
    const step=()=>{ v+=1.15; if(v>=MAX){ slider.value=MAX; render(MAX); stopAuto(); return; }
      slider.value=Math.round(v); render(Math.round(v)); raf=requestAnimationFrame(step); };
    raf=requestAnimationFrame(step);
  });

  // ---------- confetti: ₹ coins + chips ----------
  const cv=$("fx"), ctx=cv.getContext("2d"); let dpr=1, parts=[], anim=null;
  const size=()=>{ dpr=Math.min(2,devicePixelRatio||1); cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); };
  size(); addEventListener("resize", size);
  const COLORS=["#C4F62E","#E8B923","#FF5A1F","#A9D91A"];
  const burst=(x,y)=>{
    for(let i=0;i<40;i++){ const a=Math.random()*Math.PI*2, sp=3+Math.random()*7, coin=Math.random()<.45;
      parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-4,g:.22+Math.random()*.12,rot:Math.random()*6.28,vr:(Math.random()-.5)*.4,
        size:8+Math.random()*9,color:COLORS[(Math.random()*COLORS.length)|0],coin,life:0}); }
    if(!anim) anim=requestAnimationFrame(tick);
  };
  const tick=()=>{
    ctx.clearRect(0,0,cv.width,cv.height);
    parts=parts.filter(p=>p.life<150 && p.y<innerHeight+40);
    parts.forEach(p=>{ p.life++; p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.vx*=.99;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.globalAlpha=Math.max(0,1-p.life/150);
      if(p.coin){ ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(0,0,p.size*.6,0,6.28); ctx.fill();
        ctx.fillStyle="rgba(0,0,0,.55)"; ctx.font=`800 ${p.size}px "Bricolage Grotesque",sans-serif`; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("₹",0,0);
      } else { ctx.fillStyle=p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.6); }
      ctx.restore();
    });
    if(parts.length) anim=requestAnimationFrame(tick); else { ctx.clearRect(0,0,cv.width,cv.height); anim=null; }
  };

  // init (run now + after fonts settle)
  const boot=()=>{ render(0); };
  boot();
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>render(+slider.value));
  addEventListener("load", ()=>render(+slider.value));
})();
</script>
